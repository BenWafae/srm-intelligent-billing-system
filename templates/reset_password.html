<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRM — Nouveau mot de passe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #faf7f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            max-width: 450px;
            margin: 20px;
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.1);
        }
        .btn {
            background: #1e3155;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
        }
        .btn:hover { background: #2a4570; }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #d4a44a;
        }
        .success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .error {
            background: #ffebee;
            color: #c62828;
        }
        h1 { color: #1e3155; font-size: 28px; margin-bottom: 8px; }
        .sub { color: #64748b; margin-bottom: 24px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Nouveau mot de passe</h1>
        <p class="sub">Créez un nouveau mot de passe pour votre compte.</p>
        
        {% if success %}
        <div class="success">{{ success }}</div>
        <p style="text-align: center; margin-top: 20px;">
            <a href="/" style="color: #79ad66; text-decoration: none;">Se connecter</a>
        </p>
        {% else %}
        
        {% if error %}
        <div class="success error">{{ error }}</div>
        {% endif %}
        
        <form method="POST">
            <input type="hidden" name="token" value="{{ token }}">
            <input type="password" name="password" placeholder="Nouveau mot de passe (min. 4 caractères)" required minlength="4">
            <button type="submit" class="btn">Modifier mon mot de passe</button>
        </form>
        
        <p style="text-align: center; margin-top: 24px; font-size: 13px;">
            <a href="/" style="color: #79ad66; text-decoration: none;">Retour à la connexion</a>
        </p>
        {% endif %}
    </div>
</body>
</html>
