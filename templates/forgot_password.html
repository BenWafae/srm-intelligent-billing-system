<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRM — Mot de passe oublié</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #faf7f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            max-width: 460px;
            width: 100%;
            background: white;
            border-radius: 32px;
            padding: 48px 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            color: #1e3155;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        .sub {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 32px;
            line-height: 1.5;
        }
        /* Input style identique au login */
        .field {
            margin-bottom: 24px;
        }
        .input-wrap {
            position: relative;
        }
        .inp-ico {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #8a9ab5;
            transition: color 0.2s, transform 0.3s;
            pointer-events: none;
        }
        .input-wrap:focus-within .inp-ico {
            color: #d4a44a;
            transform: translateY(-50%) scale(1.1);
        }
        .field-inp {
            width: 100%;
            padding: 14px 16px 14px 46px;
            border: 1.5px solid #e8ecf2;
            border-radius: 14px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            color: #1e3155;
            background: #fafbfd;
            transition: all 0.25s ease;
            outline: none;
        }
        .field-inp::placeholder {
            color: #cbd5e1;
        }
        .field-inp:focus {
            border-color: #eaba62;
            background: white;
            box-shadow: 0 0 0 4px rgba(212, 164, 74, 0.1);
            transform: translateY(-1px);
        }
        /* Bouton style identique au login */
        .btn-submit {
            width: 100%;
            padding: 14px 24px;
            border: none;
            cursor: pointer;
            border-radius: 14px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.01em;
            color: #1e3155;
            background: linear-gradient(110deg, #f5e4be 0%, #eaba62 45%, #d4a44a 100%);
            position: relative;
            overflow: hidden;
            transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 16px rgba(212, 164, 74, 0.32);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(212, 164, 74, 0.46);
        }
        .btn-submit:active {
            transform: translateY(0);
        }
        /* Messages */
        .message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 14px 16px;
            border-radius: 14px;
            margin-bottom: 24px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 3px solid #2e7d32;
        }
        .error {
            background: #ffebee;
            color: #c62828;
            border-left-color: #c62828;
        }
        /* Lien retour */
        .back-link {
            text-align: center;
            margin-top: 28px;
        }
        .back-link a {
            color: #79ad66;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .back-link a:hover {
            color: #5e8a4f;
        }
        /* Séparateur */
        .divider {
            margin: 28px 0 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .divider-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, #e2e8f0, transparent);
        }
        .divider-text {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Mot de passe oublié</h1>
        <p class="sub">Entrez votre email pour recevoir un lien de réinitialisation.</p>

        {% if message %}
        <div class="message">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            {{ message }}
        </div>
        {% endif %}

        {% if error %}
        <div class="message error">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            <div class="field">
                <div class="input-wrap">
                    <span class="inp-ico">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                        </svg>
                    </span>
                    <input class="field-inp" type="email" name="email" placeholder="votre.email@srm.ma" autocomplete="email" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                </svg>
                Envoyer le lien
            </button>
        </form>

        <div class="divider">
            <div class="divider-line"></div>
            <span class="divider-text">SRM Souss-Massa</span>
            <div class="divider-line"></div>
        </div>

        <div class="back-link">
            <a href="/">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                </svg>
                Retour à la connexion
            </a>
        </div>
    </div>
</body>
</html>
